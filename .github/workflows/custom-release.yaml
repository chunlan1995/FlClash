name: Custom Release (Windows EXE & Android APK)
on:
  workflow_dispatch:
  push: {branches: [main], paths: ['custom_mod/**', '.github/workflows/custom-release.yaml']}
permissions: {contents: write}
concurrency: {group: 'custom-release-${{ github.ref }}', cancel-in-progress: true}
env: {FLUTTER_VERSION: '3.47.6', GO_VERSION: '1.27.1', NDK_VERSION: r28c}
jobs:
  version:
    name: Next +0.0.1 Version
    runs-on: ubuntu-latest
    outputs: {ver: '${{ steps.v.outputs.ver }}', code: '${{ steps.v.outputs.code }}'}
    steps:
      - {uses: actions/checkout@v4, with: {fetch-depth: 0}}
      - {id: v, run: python3 custom_mod/setup_custom.py --calc-version}
  build:
    name: Build ${{ matrix.platform }}
    needs: [version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: {include: [{platform: android, os: ubuntu-latest, arch: arm64}, {platform: windows, os: Windows-2022, arch: amd64}]}
    steps:
      - {uses: actions/checkout@v4, with: {submodules: recursive}}
      - {uses: actions/setup-go@v5, with: {go-version: '${{ env.GO_VERSION }}', cache: true, cache-dependency-path: core/go.sum}}
      - {if: "matrix.platform == 'android'", uses: actions/setup-java@v4, with: {distribution: temurin, java-version: '17'}}
      - {if: "matrix.platform == 'android'", uses: gradle/actions/setup-gradle@v6}
      - {if: "matrix.platform == 'android'", id: build-ndk, uses: nttld/setup-ndk@v1, with: {ndk-version: '${{ env.NDK_VERSION }}', add-to-path: true, link-to-sdk: true}}
      - {if: "matrix.platform == 'windows'", run: git config --global core.longpaths true}
      - {uses: subosito/flutter-action@v2, with: {channel: stable, flutter-version: '${{ env.FLUTTER_VERSION }}', cache: true}}
      - {run: flutter pub get}
      - name: Fetch CA
        shell: bash
        run: b=core/Clash.Meta/component/ca/ca-certificates.crt && mkdir -p "$(dirname "$b")" && u="ht""tps://curl.se/ca/cacert-2026-09-25.pem" && curl -fsSL --retry 3 -o "$b" "$u" && echo "a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505  $b" | sha256sum -c -
      - name: Apply Customizations
        shell: bash
        env: {APP_VER: '${{ needs.version.outputs.ver }}', APP_CODE: '${{ needs.version.outputs.code }}'}
        run: (python3 custom_mod/setup_custom.py || python custom_mod/setup_custom.py) && dart format lib/custom lib/pages/home.dart lib/providers/actions/setup.dart && flutter analyze --no-fatal-infos --no-fatal-warnings lib/custom lib/pages/home.dart lib/providers/actions/setup.dart
      - {if: "matrix.platform == 'android'", name: Build Android APK, env: {ANDROID_NDK_HOME: '${{ steps.build-ndk.outputs.ndk-path }}'}, run: dart setup.dart android --arch arm64 --env stable -v}
      - {if: "matrix.platform == 'windows'", name: Build Windows EXE, run: dart setup.dart windows --env stable -v}
      - {uses: actions/upload-artifact@v4, with: {name: 'custom-${{ matrix.platform }}-${{ matrix.arch }}', path: ./dist, overwrite: true}}
  release:
    name: Publish Release (.exe & .apk)
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - {uses: actions/download-artifact@v4, with: {path: ./dist, pattern: 'custom-*', merge-multiple: true}}
      - {name: SHA256SUMS, run: cd ./dist && sha256sum ./* > SHA256SUMS.txt && ls -lh}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.ver }}
          name: FlClash 个人定制版 v${{ needs.version.outputs.ver }}
          body: "FlClash 个人定制版 v${{ needs.version.outputs.ver }}：固定签名支持直接覆盖安装 · 独立 +0.0.1 自动递增版本 · 极简模式无视订阅规则全局流量接管 + 应用/进程直连放通白名单 · 国家/区域自动聚合与粘性一致 IP"
          files: ./dist/*
