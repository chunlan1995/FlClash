name: Custom Release (Windows EXE & Android APK)
on:
  workflow_dispatch:
  push: { branches: [main], paths: ['custom_mod/**', '.github/workflows/custom-release.yaml'] }
permissions: { contents: write }
concurrency: { group: "custom-release-${{ github.ref }}", cancel-in-progress: true }
env: { FLUTTER_VERSION: '3.47.6', GO_VERSION: '1.27.1', NDK_VERSION: r28c }
jobs:
  build:
    name: "Build ${{ matrix.platform }}"
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: android, os: ubuntu-latest, arch: arm64 }
          - { platform: windows, os: Windows-2022, arch: amd64 }
    steps:
      - { name: Prepare Windows, if: "matrix.platform == 'windows'", shell: pwsh, run: 'git config --global core.longpaths true; if (Test-Path "C:\Program Files (x86)\Inno Setup 6") { "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }' }
      - { name: Checkout, uses: actions/checkout@v4, with: { submodules: recursive } }
      - { name: Setup Go, uses: actions/setup-go@v5, with: { go-version: "${{ env.GO_VERSION }}", cache: true, cache-dependency-path: core/go.sum } }
      - { name: Setup Java, if: "matrix.platform == 'android'", uses: actions/setup-java@v4, with: { distribution: temurin, java-version: '17' } }
      - { name: Setup Gradle, if: "matrix.platform == 'android'", uses: gradle/actions/setup-gradle@v6 }
      - { name: Setup NDK, if: "matrix.platform == 'android'", uses: nttld/setup-ndk@v1, id: build-ndk, with: { ndk-version: "${{ env.NDK_VERSION }}", add-to-path: true, link-to-sdk: true } }
      - { name: Setup Flutter, uses: subosito/flutter-action@v2, with: { channel: stable, flutter-version: "${{ env.FLUTTER_VERSION }}", cache: true } }
      - { name: Pub Get, run: flutter pub get }
      - { name: Fetch CA, shell: bash, run: 'b=core/Clash.Meta/component/ca/ca-certificates.crt; mkdir -p "$(dirname "$b")"; curl -fsSL --retry 3 -o "$b" https://curl.se/ca/cacert-2026-09-25.pem; echo "a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505  $b" | sha256sum -c -' }
      - { name: Apply Customizations, shell: bash, run: '(python3 custom_mod/setup_custom.py || python custom_mod/setup_custom.py) && dart format lib/custom lib/pages/home.dart && flutter analyze --no-fatal-infos --no-fatal-warnings lib/custom' }
      - { name: Build Android APK, if: "matrix.platform == 'android'", env: { ANDROID_NDK: "${{ steps.build-ndk.outputs.ndk-path }}", ANDROID_NDK_HOME: "${{ steps.build-ndk.outputs.ndk-path }}", ANDROID_NDK_ROOT: "${{ steps.build-ndk.outputs.ndk-path }}" }, run: dart setup.dart android --arch arm64 --env stable -v }
      - { name: Build Windows EXE, if: "matrix.platform == 'windows'", run: dart setup.dart windows --env stable -v }
      - { name: Upload Artifact, uses: actions/upload-artifact@v4, with: { name: "custom-${{ matrix.platform }}-${{ matrix.arch }}", path: ./dist, overwrite: true } }
  release:
    name: Publish Release (.exe & .apk)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - { name: Download Artifacts, uses: actions/download-artifact@v4, with: { path: ./dist, pattern: "custom-*", merge-multiple: true } }
      - { name: Generate SHA256SUMS, shell: bash, run: 'find ./dist -mindepth 2 -type f -exec mv -f {} ./dist/ \; || true; find ./dist -mindepth 1 -type d -empty -delete || true; cd ./dist && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -exec sha256sum {} + > SHA256SUMS.txt && ls -lh' }
      - { name: Create GitHub Release, uses: softprops/action-gh-release@v2, with: { tag_name: "v0.9.3-custom.${{ github.run_number }}", name: "FlClash 个人定制版 Build #${{ github.run_number }}", body: "### FlClash 个人定制版（Windows .exe & Android .apk）\n- **默认极简模式**：启动直达极简工作台，支持一键开关代理、切换/导入订阅与切回完整面板\n- **1000ms 严格超时无缝转接**：探测 >= 1000ms 或连接超时自动按 同 /24 IP段 → 同 /16 IP段 → 同国家/区域 无缝切换并重置旧连接\n- **当次运行进程流量监控**：实时统计各进程/应用上下行速率与当次运行累计总流量\n- **明确清晰运行日志**：分类筛选无缝转接、进程连接与核心告警", files: "./dist/*" } }
